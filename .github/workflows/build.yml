name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']    # release.yml owns tag builds
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake pkg-config libsqlite3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # CMake configure must run before the frontend build because it
      # materialises web/src/version.js (and src/version.h) via configure_file
      # from .in templates. Without it, the Svelte build can't resolve the
      # `import { VERSION } from '../version.js'` in Footer.svelte.
      - name: Configure (generates version.{js,h})
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build frontend bundle
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          bash embed.sh

      - name: Build backend
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test
        run: |
          ./build/src/hashhush --version
          ./build/src/hashhush --help

      - uses: actions/upload-artifact@v4
        with:
          name: hashhush-${{ github.sha }}
          path: build/src/hashhush
          retention-days: 7
